services:
  - type: web
    name: sgd-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: sgd_db_bnts
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_VIEWER_PASSWORD
        sync: false
      - key: SEED_GESTOR_PASSWORD
        sync: false
      - key: SEED_ANALISTA_PASSWORD
        sync: false
      - key: SEED_DIRETOR_PASSWORD
        sync: false
      - key: SEED_TECNICO_PASSWORD
        sync: false
      - key: SEED_PARCEIRO_PASSWORD
        sync: false
      - key: SEED_CLIENTE_PASSWORD
        sync: false
      - key: SEED_VISITANTE_PASSWORD
        sync: false
      - key: COOKIE_DOMAIN
        value: gruposgd.com.br
      - key: CORS_ORIGIN
        value: https://gruposgd.com.br,https://www.gruposgd.com.br,http://localhost:3000
      - key: PUBLIC_API_URL
        value: https://api.gruposgd.com.br/api
